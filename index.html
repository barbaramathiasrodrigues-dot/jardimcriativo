<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Laboratório de Criação — Rivendell OS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #070a08 0%, #111a13 50%, #050806 100%);
      color: #e2d1b0;
      font-family: 'MedievalSharp', cursive, serif;
      min-height: 100vh;
    }
    .lotr-title { font-family: 'Cinzel Decorative', serif; }
    .lotr-sub { font-family: 'Cinzel', serif; }
    .glass-card {
      background: rgba(15, 22, 17, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.88);
    }
    .glass-inner {
      background: rgba(8, 12, 9, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
  </style>
</head>
<body class="p-2 sm:p-5" x-data="laboratorioCriacaoApp()" x-init="initApp()">

  <div class="max-w-3xl mx-auto space-y-4">

    <!-- CABEÇALHO -->
    <header class="glass-card rounded-3xl p-4 sm:p-5 border border-amber-600/40 text-center space-y-2">
      <div class="flex justify-between items-center text-[10px] lotr-sub font-bold">
        <span class="text-emerald-400">Ateliê Criativo • Laboratório de Sistemas</span>
        <span x-show="salvando" class="text-amber-400 animate-pulse">🖋️ Sync...</span>
        <span x-show="!salvando" class="text-emerald-400">🟢 Notion Sync</span>
      </div>

      <h1 class="text-xl sm:text-2xl lotr-title font-bold text-amber-400 drop-shadow-md">
        🧪 Laboratório de Criação & Conexões
      </h1>
      <p class="text-xs text-amber-200/70 italic">"Reclame criando algo melhor. Transforme bastidores em estoque."</p>

      <!-- BARRA DE ABAS REESTRUTURADA -->
      <nav class="mt-3 bg-stone-950/90 p-1 rounded-2xl border border-amber-900/40 grid grid-cols-5 gap-1 text-[9px] sm:text-[10px] font-bold lotr-sub">
        <button @click="abaAtiva = 'mosaico'" :class="abaAtiva === 'mosaico' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70'" class="py-2 rounded-xl">
          🧩 Mosaico
        </button>
        <button @click="abaAtiva = 'captura'" :class="abaAtiva === 'captura' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70'" class="py-2 rounded-xl">
          🎯 Captura & Furtos
        </button>
        <button @click="abaAtiva = 'conexoes'" :class="abaAtiva === 'conexoes' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70'" class="py-2 rounded-xl">
          🔀 Conexões & Tags
        </button>
        <button @click="abaAtiva = 'bordo'" :class="abaAtiva === 'bordo' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70'" class="py-2 rounded-xl">
          ⛵ Diário de Bordo
        </button>
        <button @click="abaAtiva = 'esteira'" :class="abaAtiva === 'esteira' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70'" class="py-2 rounded-xl">
          🚀 Esteira & Redes
        </button>
      </nav>
    </header>

    <!-- ABA 1: MOSAICO + BOTÃO ENVIAR PARA CAPTURA -->
    <template x-if="abaAtiva === 'mosaico'">
      <div class="space-y-4">
        <section class="glass-card rounded-3xl p-5 space-y-4 border border-emerald-500/40">
          <div class="flex justify-between items-center border-b border-amber-900/40 pb-2">
            <span class="text-xs font-bold text-amber-300 lotr-title">🧩 Mosaico do Cérebro 2026</span>
            <span class="text-[10px] text-amber-200/60 italic" x-text="diaDetalheChave ? 'Dia: ' + diaDetalheChave : 'Selecione um dia'"></span>
          </div>

          <!-- SELETOR DO MÊS -->
          <div class="flex items-center justify-between text-xs font-bold lotr-sub bg-stone-950/80 p-2 rounded-2xl border border-amber-900/40">
            <button @click="mesAtualIndex = (mesAtualIndex > 0 ? mesAtualIndex - 1 : 11)" class="text-amber-400 p-1">◀</button>
            <span class="text-amber-300 font-extrabold text-sm" x-text="nomesMeses[mesAtualIndex] + ' 2026'"></span>
            <button @click="mesAtualIndex = (mesAtualIndex < 11 ? mesAtualIndex + 1 : 0)" class="text-amber-400 p-1">▶</button>
          </div>

          <!-- GRADE -->
          <div class="grid grid-cols-7 gap-2 text-center text-xs">
            <template x-for="dia in diasDoMes" :key="dia.chave">
              <div 
                @click="dia.valido && selecionarDiaParaEditar(dia.chave)"
                :style="obterEstiloGradienteDia(dia.chave)"
                :class="[
                  dia.valido ? 'cursor-pointer hover:scale-110' : 'opacity-10 cursor-default',
                  diaDetalheChave === dia.chave ? 'ring-2 ring-amber-300 scale-105' : '',
                  !temCor(dia.chave) ? 'bg-stone-950/80 border-stone-800 text-amber-200/50' : 'border-amber-400/60 text-stone-950 font-black'
                ]"
                class="h-11 rounded-xl border flex flex-col items-center justify-center relative overflow-hidden">
                <span class="text-[11px] font-bold z-10" x-text="dia.numero"></span>
              </div>
            </template>
          </div>

          <!-- CAMPO OBSERVAÇÃO + ENVIAR PARA CAPTURA -->
          <div x-show="diaDetalheChave" class="p-4 bg-stone-950/90 rounded-2xl border border-amber-800/60 space-y-3 text-xs">
            <div class="flex justify-between items-center">
              <span class="font-bold text-amber-300" x-text="'📝 Nota do Dia • ' + diaDetalheChave"></span>
              <button @click="diaDetalheChave = null" class="text-amber-400">✕</button>
            </div>
            
            <textarea x-model="mosaico[diaDetalheChave].observacaoCalendario" @input="saveState()" rows="2" placeholder="Anote a ideia rápida ou ocorrência..." class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>

            <button @click="enviarObsParaCaptura()" class="w-full py-2 bg-gradient-to-r from-emerald-600 to-teal-600 text-stone-950 font-bold rounded-xl uppercase text-[10px]">
              🎯 Transformar Observação em Captura das 25 Fontes
            </button>
          </div>
        </section>
      </div>
    </template>

    <!-- ABA 2: CAPTURA & FURTOS UNIFICADOS (25 FONTES) -->
    <template x-if="abaAtiva === 'captura'">
      <section class="glass-card rounded-3xl p-5 space-y-4 border border-amber-500/40">
        <div class="border-b border-amber-900/40 pb-2">
          <h2 class="text-sm font-bold text-amber-300 lotr-title">🎯 Banco de Captura & Furtos (25 Fontes)</h2>
          <p class="text-[10px] text-amber-200/60 italic">Catalogado com tags de assunto para cruzamentos futuros</p>
        </div>

        <!-- FORMULÁRIO DE CAPTURA COM TAGS -->
        <div class="p-4 bg-stone-950/90 rounded-2xl border border-amber-800/60 space-y-3 text-xs">
          <span class="font-bold text-amber-300 block">➕ Nova Captura / Roubo Criativo:</span>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <select x-model="novaCaptura.fonte" class="p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
              <template x-for="f in fontesMandala" :key="f.nome">
                <option :value="f.nome" x-text="f.icon + ' ' + f.nome"></option>
              </template>
            </select>
            <input type="text" x-model="novaCaptura.tags" placeholder="Tags separadas por vírgula (Ex: #tdah, #design)" class="p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
          </div>

          <textarea x-model="novaCaptura.conteudo" rows="2" placeholder="O que você capturou ou roubou de interessante?" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>

          <button @click="salvarCaptura()" class="w-full py-2 bg-amber-600 text-stone-950 font-bold rounded-xl uppercase text-[10px]">
            💾 Guardar na Mandala de Captura
          </button>
        </div>

        <!-- LISTA DE CAPTURAS -->
        <div class="space-y-3 max-h-[400px] overflow-y-auto text-xs">
          <template x-for="(cap, idx) in capturas" :key="cap.id">
            <div class="p-3.5 bg-stone-950/80 rounded-2xl border border-amber-900/40 space-y-1.5">
              <div class="flex justify-between items-center text-[10px]">
                <span class="text-amber-400 font-bold" x-text="'Fonte: ' + cap.fonte"></span>
                <span class="text-amber-200/50" x-text="cap.data"></span>
              </div>
              <p class="text-amber-100" x-text="cap.conteudo"></p>
              <div class="flex flex-wrap gap-1 pt-1">
                <template x-for="tag in cap.tagsArray" :key="tag">
                  <span class="text-[9px] bg-amber-950 text-amber-300 px-2 py-0.5 rounded-full border border-amber-800" x-text="tag"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </section>
    </template>

    <!-- ABA 3: CONEXÕES & TRANSFORMAÇÃO DE RECLAMAÇÕES -->
    <template x-if="abaAtiva === 'conexoes'">
      <section class="glass-card rounded-3xl p-5 space-y-4 border border-amber-500/40">
        <div class="border-b border-amber-900/40 pb-2">
          <h2 class="text-sm font-bold text-amber-300 lotr-title">🔀 Cruzamento de Ideias & Laboratório</h2>
          <p class="text-[10px] text-amber-200/60 italic">Junte tags, escreva hipóteses e transforme queixas em sistemas melhores</p>
        </div>

        <!-- RECLAMAÇÃO -> SOFTWARE MELHOR -->
        <div class="p-4 bg-rose-950/30 border border-rose-800/50 rounded-2xl space-y-2 text-xs">
          <span class="font-bold text-rose-300 block">💡 Transformador de Reclamações (Modo Gertrudes $\rightarrow$ Solução)</span>
          <p class="text-[10px] text-amber-200/60 italic">"A melhor maneira de reclamar de um software é criando um software melhor."</p>

          <input type="text" x-model="queixa.reclamacao" placeholder="Do que você quer reclamar hoje? (Qual a insatisfação?)" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
          <textarea x-model="queixa.solucao" rows="2" placeholder="Como seria a solução ideal que resolve essa dor?" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>

          <button @click="salvarQueixaComoIdeia()" class="w-full py-2 bg-rose-700 hover:bg-rose-600 text-stone-950 font-bold rounded-xl uppercase text-[10px]">
            ⚡ Transformar Reclamação em Ideia de Projeto/Post
          </button>
        </div>

        <!-- PAINEL LIVRE DE CRUZAMENTO -->
        <div class="p-4 bg-stone-950/90 border border-amber-800/60 rounded-2xl space-y-3 text-xs">
          <span class="font-bold text-amber-300 block">🎨 Painel de Escrita & Imagem de Conexão:</span>
          
          <textarea x-model="novoCruzamento.texto" rows="3" placeholder="Escreva sobre a fusão das tags e ideias..." class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>

          <div class="flex justify-between items-center">
            <input type="file" accept="image/*" @change="uploadImagemCruzamento($event)" class="text-[10px] text-amber-200/70">
            <button @click="salvarCruzamento()" class="px-4 py-2 bg-amber-600 text-stone-950 font-bold rounded-xl uppercase text-[10px]">
              Guardar Conexão
            </button>
          </div>
        </div>
      </section>
    </template>

    <!-- ABA 4: DIÁRIO DE BORDO VIVO (INÍCIO / MEIO / FIM) -->
    <template x-if="abaAtiva === 'bordo'">
      <section class="glass-card rounded-3xl p-5 space-y-4 border border-amber-500/40">
        <div class="border-b border-amber-900/40 pb-2">
          <h2 class="text-sm font-bold text-amber-300 lotr-title">⛵ Diário de Bordo Vivo</h2>
          <p class="text-[10px] text-amber-200/60 italic">O que estou fazendo agora + Ideias de post por etapa</p>
        </div>

        <div class="p-4 bg-stone-950/90 rounded-2xl border border-amber-800/60 space-y-3 text-xs">
          <div>
            <label class="block font-bold text-amber-300 mb-1">Projeto / Foco Atual:</label>
            <input type="text" x-model="bordoVivo.projeto" placeholder="Ex: Desenho do Widget do Canva / Estudo do ENEM" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
          </div>

          <div>
            <label class="block font-bold text-amber-300 mb-1">Etapa Atual do Processo:</label>
            <div class="grid grid-cols-3 gap-2 text-center">
              <button @click="bordoVivo.etapa = 'Inicio'" :class="bordoVivo.etapa === 'Inicio' ? 'bg-amber-600 text-stone-950 font-black' : 'bg-stone-900 text-amber-200'" class="py-2 rounded-xl border border-stone-800">🌱 Início (Inspirações)</button>
              <button @click="bordoVivo.etapa = 'Meio'" :class="bordoVivo.etapa === 'Meio' ? 'bg-amber-600 text-stone-950 font-black' : 'bg-stone-900 text-amber-200'" class="py-2 rounded-xl border border-stone-800">🔨 Meio (Bastidores/Croquis)</button>
              <button @click="bordoVivo.etapa = 'Fim'" :class="bordoVivo.etapa === 'Fim' ? 'bg-amber-600 text-stone-950 font-black' : 'bg-stone-900 text-amber-200'" class="py-2 rounded-xl border border-stone-800">🌸 Fim (Resultado/Erros)</button>
            </div>
          </div>

          <!-- SUGESTÃO AUTOMÁTICA DE IDEIA DE POST -->
          <div class="p-3 bg-amber-950/50 rounded-xl border border-amber-700/50 text-amber-200 text-[11px] space-y-1">
            <span class="font-bold text-amber-300 block">💡 Sugestão de Conteúdo para esta Etapa:</span>
            <template x-if="bordoVivo.etapa === 'Inicio'">
              <p>Poste sobre as referências do seu "gabinete de curiosidades", o livro que inspirou ou a pergunta inicial.</p>
            </template>
            <template x-if="bordoVivo.etapa === 'Meio'">
              <p>Poste um print do rascunho, a mesa bagunçada, o diagrama ou uma foto do processo sem compromisso de perfeição.</p>
            </template>
            <template x-if="bordoVivo.etapa === 'Fim'">
              <p>Mostre o produto concluído, o que foi descartado durante o processo e a principal lição aprendida.</p>
            </template>
          </div>
        </div>
      </section>
    </template>

    <!-- ABA 5: ESTEIRA FINAL & RODA DE REDES -->
    <template x-if="abaAtiva === 'esteira'">
      <section class="glass-card rounded-3xl p-5 space-y-4 border border-amber-500/40">
        <div class="border-b border-amber-900/40 pb-2">
          <h2 class="text-sm font-bold text-amber-300 lotr-title">🚀 Esteira Final & Publicador</h2>
          <p class="text-[10px] text-amber-200/60 italic">Mapeie onde o arquivo está salvo e qual rede social receberá</p>
        </div>

        <div class="p-4 bg-stone-950/90 rounded-2xl border border-amber-800/60 space-y-3 text-xs">
          <input type="text" x-model="esteiraPublicar.titulo" placeholder="Título do Conteúdo Pronto / Rascunho" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-amber-300 mb-1">Onde está salvo?</label>
              <input type="text" x-model="esteiraPublicar.ondeSalvo" placeholder="Ex: Canva Pasta X, PC, Google Drive" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
            </div>
            <div>
              <label class="block text-[10px] text-amber-300 mb-1">Estado do Material:</label>
              <select x-model="esteiraPublicar.estado" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
                <option value="Rascunho Solto">📝 Rascunho Solto</option>
                <option value="Layout em Produção">🎨 Layout em Produção</option>
                <option value="Pronto para Postar">✅ Pronto para Postar</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-[10px] text-amber-300 mb-1">Rede Social / Destino:</label>
            <select x-model="esteiraPublicar.rede" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 font-bold">
              <option value="Instagram Studio Feed">📸 Instagram Studio (Feed)</option>
              <option value="Instagram Studio Stories">📱 Instagram Studio (Stories)</option>
              <option value="Instagram Studio Reels">🎬 Instagram Studio (Reels)</option>
              <option value="Instagram Pessoal Feed">👤 Instagram Pessoal (Feed)</option>
              <option value="Blog">🌐 Blog</option>
              <option value="Threads">💬 Threads</option>
              <option value="WhatsApp">🟢 WhatsApp / Grupo</option>
            </select>
          </div>

          <button @click="salvarNaEsteiraFinal()" class="w-full py-2 bg-gradient-to-r from-amber-600 to-yellow-600 text-stone-950 font-bold rounded-xl uppercase text-[10px]">
            🚀 Registrar Conteúdo na Esteira
          </button>
        </div>
      </section>
    </template>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBoCzavo5Poj1kjKZbJ9rUwkLQyyjpMgmI",
      authDomain: "benjamin-express-os.firebaseapp.com",
      projectId: "benjamin-express-os",
      storageBucket: "benjamin-express-os.firebasestorage.app",
      messagingSenderId: "318003877871",
      appId: "1:318003877871:web:54f4390f54c7710c5cc81a",
      measurementId: "G-41JWT5ZN72"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function laboratorioCriacaoApp() {
      return {
        salvando: false,
        abaAtiva: 'mosaico',
        mesAtualIndex: new Date().getMonth(),
        diaDetalheChave: new Date().toISOString().split('T')[0],
        mosaico: {},
        capturas: [],
        conexoes: [],
        esteiraFinal: [],

        novaCaptura: { fonte: 'Pesquisas', tags: '', conteudo: '' },
        queixa: { reclamacao: '', solucao: '' },
        novoCruzamento: { texto: '', imagem: null },
        bordoVivo: { projeto: '', etapa: 'Meio' },
        esteiraPublicar: { titulo: '', ondeSalvo: '', estado: 'Rascunho Solto', rede: 'Instagram Studio Feed' },

        nomesMeses: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'],

        fontesMandala: [
          { nome: 'Pesquisas', icon: '🔍' }, { nome: 'Referências', icon: '📚' },
          { nome: 'Desenhos', icon: '✏️' }, { nome: 'Planos', icon: '🗺️' },
          { nome: 'Rabiscos', icon: '🎨' }, { nome: 'Protótipos', icon: '🛠️' },
          { nome: 'Diagramas', icon: '📊' }, { nome: 'Notas Rápidas', icon: '📝' },
          { nome: 'Fotografias', icon: '📸' }, { nome: 'Lixo de Projetos', icon: '♻️' },
          { nome: 'O que estou Aprendendo', icon: '🧠' }, { nome: 'O que estou Fazendo', icon: '🔨' },
          { nome: 'Livros', icon: '📖' }, { nome: 'TV & Filmes', icon: '🎬' },
          { nome: 'Sites & Newsletters', icon: '🌐' }, { nome: 'Mesa / Físico', icon: '🪴' },
          { nome: 'Insights de Conversas', icon: '💬' }, { nome: 'Posts & Interações', icon: '📱' },
          { nome: 'Padrões de Posts', icon: '📋' }, { nome: 'Curtidos & Salvos', icon: '⭐' },
          { nome: 'Pinterest', icon: '📌' }, { nome: 'Rascunhos do Blog', icon: '✍️' },
          { nome: 'Trello', icon: '🗂️' }, { nome: 'Arquivos do PC', icon: '💻' },
          { nome: 'Arquivos do Canva', icon: '🎨' }
        ],

        legendas: [
          { id: 'escrevi', nome: 'Escrevi / Texto', icon: '🟩', hex: '#34d399' },
          { id: 'li', nome: 'Li / Pesquisei', icon: '🟦', hex: '#38bdf8' },
          { id: 'ideia', nome: 'Tive uma Ideia', icon: '🟨', hex: '#fde047' },
          { id: 'desenhei', nome: 'Desenhei / Design', icon: '🟪', hex: '#c084fc' },
          { id: 'incubacao', nome: 'Incubei o Projeto', icon: '🟥', hex: '#fb7185' },
          { id: 'descanso', nome: 'Descansei', icon: '⬜', hex: '#d6d3d1' }
        ],

        get diasDoMes() {
          const ano = 2026;
          const primeiroDiaSemana = new Date(ano, this.mesAtualIndex, 1).getDay();
          const totalDiasNoMes = new Date(ano, this.mesAtualIndex + 1, 0).getDate();
          let lista = [];
          for (let i = 0; i < primeiroDiaSemana; i++) lista.push({ numero: '', chave: `vazio_${i}`, valido: false });
          for (let d = 1; d <= totalDiasNoMes; d++) {
            const mesStr = String(this.mesAtualIndex + 1).padStart(2, '0');
            const diaStr = String(d).padStart(2, '0');
            lista.push({ numero: d, chave: `2026-${mesStr}-${diaStr}`, valido: true });
          }
          return lista;
        },

        async initApp() {
          const cache = localStorage.getItem('laboratorio_criacao_backup');
          if (cache) {
            try {
              const parsed = JSON.parse(cache);
              this.mosaico = parsed.mosaico || {};
              this.capturas = parsed.capturas || [];
              this.conexoes = parsed.conexoes || [];
              this.esteiraFinal = parsed.esteiraFinal || [];
            } catch(e) {}
          }

          db.collection("modo_casa").doc("laboratorio_criacao").onSnapshot((docSnap) => {
            if (docSnap.exists) {
              const data = docSnap.data();
              if (data.mosaico) this.mosaico = data.mosaico;
              if (data.capturas) this.capturas = data.capturas;
              if (data.conexoes) this.conexoes = data.conexoes;
              if (data.esteiraFinal) this.esteiraFinal = data.esteiraFinal;
            }
          });

          if (!this.mosaico[this.diaDetalheChave]) {
            this.mosaico[this.diaDetalheChave] = { tipos: [], observacaoCalendario: '' };
          }
        },

        selecionarDiaParaEditar(chave) {
          this.diaDetalheChave = chave;
          if (!this.mosaico[chave]) this.mosaico[chave] = { tipos: [], observacaoCalendario: '' };
        },

        enviarObsParaCaptura() {
          const obs = this.mosaico[this.diaDetalheChave].observacaoCalendario;
          if (!obs) return alert('Escreva uma observação no dia antes de enviar.');
          this.novaCaptura.conteudo = obs;
          this.novaCaptura.fonte = 'Notas Rápidas';
          this.abaAtiva = 'captura';
        },

        salvarCaptura() {
          if (!this.novaCaptura.conteudo) return alert('Insira um conteúdo para a captura.');
          const tagsArr = this.novaCaptura.tags.split(',').map(t => t.trim()).filter(t => t);
          this.capturas.unshift({
            id: 'c_' + Date.now(),
            fonte: this.novaCaptura.fonte,
            conteudo: this.novaCaptura.conteudo,
            tagsArray: tagsArr,
            data: new Date().toLocaleDateString('pt-BR')
          });
          this.novaCaptura = { fonte: 'Pesquisas', tags: '', conteudo: '' };
          this.saveState();
        },

        salvarQueixaComoIdeia() {
          if (!this.queixa.reclamacao) return alert('Preencha a reclamação.');
          this.capturas.unshift({
            id: 'c_' + Date.now(),
            fonte: 'Modo Gertrudes / Software Melhor',
            conteudo: `🚨 Reclamação: ${this.queixa.reclamacao} | 💡 Solução Ideal: ${this.queixa.solucao}`,
            tagsArray: ['#solucao', '#software-melhor'],
            data: new Date().toLocaleDateString('pt-BR')
          });
          this.queixa = { reclamacao: '', solucao: '' };
          this.abaAtiva = 'captura';
          this.saveState();
        },

        salvarNaEsteiraFinal() {
          if (!this.esteiraPublicar.titulo) return alert('Insira o título do conteúdo.');
          this.esteiraFinal.unshift({ ...this.esteiraPublicar, id: 'e_' + Date.now() });
          this.esteiraPublicar = { titulo: '', ondeSalvo: '', estado: 'Rascunho Solto', rede: 'Instagram Studio Feed' };
          this.saveState();
          alert('🚀 Registrado na esteira final com sucesso!');
        },

        temCor(chave) { return this.mosaico[chave] && this.mosaico[chave].tipos && this.mosaico[chave].tipos.length > 0; },

        obterEstiloGradienteDia(chave) {
          if (!this.temCor(chave)) return '';
          const tipos = this.mosaico[chave].tipos;
          let cores = tipos.map(tId => {
            const leg = this.legendas.find(l => l.id === tId);
            return leg ? leg.hex : '#78716c';
          });
          if (cores.length === 1) return `background-color: ${cores[0]};`;
          const percentual = 100 / cores.length;
          let stops = [];
          cores.forEach((cor, idx) => stops.push(`${cor} ${(idx * percentual).toFixed(1)}% ${((idx + 1) * percentual).toFixed(1)}%`));
          return `background: linear-gradient(to bottom, ${stops.join(', ')});`;
        },

        salvarLocal() {
          localStorage.setItem('laboratorio_criacao_backup', JSON.stringify({
            mosaico: this.mosaico, capturas: this.capturas, conexoes: this.conexoes, esteiraFinal: this.esteiraFinal
          }));
        },

        async saveState() {
          this.salvando = true;
          this.salvarLocal();
          try {
            await db.collection("modo_casa").doc("laboratorio_criacao").set({
              mosaico: this.mosaico, capturas: this.capturas, conexoes: this.conexoes, esteiraFinal: this.esteiraFinal,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            this.salvando = false;
          } catch(e) { this.salvando = false; }
        }
      }
    }
  </script>
</body>
