<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Laboratório Criativo — Rivendell OS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Fontes Épicas da Terra Média -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #070a08 0%, #111a13 50%, #050806 100%);
      color: #e2d1b0;
      font-family: 'MedievalSharp', cursive, serif;
      min-height: 100vh;
    }
    .lotr-title { font-family: 'Cinzel Decorative', serif; }
    .lotr-sub { font-family: 'Cinzel', serif; }
    .glass-card {
      background: rgba(15, 22, 17, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.88);
    }
    .glass-inner {
      background: rgba(8, 12, 9, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    @media print {
      body { background: #fff !important; color: #000 !important; font-family: sans-serif !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .glass-card, .glass-inner { background: none !important; border: 1px solid #aaa !important; box-shadow: none !important; color: #000 !important; }
    }
  </style>
</head>
<body class="p-2 sm:p-5" x-data="laboratorioCriacaoApp()" x-init="initApp()">

  <div class="max-w-3xl mx-auto space-y-4">

    <!-- CABEÇALHO DO HUB CRIATIVO -->
    <header class="glass-card rounded-3xl p-4 sm:p-5 border border-amber-600/40 text-center space-y-2 no-print">
      <div class="flex justify-between items-center text-[10px] lotr-sub font-bold">
        <span class="text-emerald-400">Ateliê Criativo • NeuroOrganizer OS</span>
        <div class="flex items-center gap-2">
          <span x-show="salvando" class="text-amber-400 animate-pulse">🖋️ Sync...</span>
          <span x-show="!salvando" class="text-emerald-400">🟢 Notion Sync</span>
        </div>
      </div>

      <h1 class="text-xl sm:text-2xl lotr-title font-bold text-amber-400 drop-shadow-md">
        🧪 Laboratório de Criação & Conexões
      </h1>
      <p class="text-xs text-amber-200/70 italic">"Reclame criando algo melhor. Transforme bastidores em estoque."</p>

      <!-- BARRA DE NAVEGAÇÃO DE 7 ABAS -->
      <nav class="mt-3 bg-stone-950/90 p-1 rounded-2xl border border-amber-900/40 grid grid-cols-4 sm:grid-cols-7 gap-1 text-[9px] sm:text-[10px] font-bold lotr-sub">
        <button @click="abaAtiva = 'mosaico'" :class="abaAtiva === 'mosaico' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70 hover:text-amber-100'" class="py-2 rounded-xl transition">
          🧩 Mosaico
        </button>
        <button @click="abaAtiva = 'captura'" :class="abaAtiva === 'captura' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70 hover:text-amber-100'" class="py-2 rounded-xl transition">
          🎯 Captura (25)
        </button>
        <button @click="abaAtiva = 'conexoes'" :class="abaAtiva === 'conexoes' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70 hover:text-amber-100'" class="py-2 rounded-xl transition">
          🔀 Conexões
        </button>
        <button @click="abaAtiva = 'bordo'" :class="abaAtiva === 'bordo' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70 hover:text-amber-100'" class="py-2 rounded-xl transition">
          ⛵ Bordo
        </button>
        <button @click="abaAtiva = 'esteira'" :class="abaAtiva === 'esteira' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70 hover:text-amber-100'" class="py-2 rounded-xl transition">
          🚀 Esteira
        </button>
        <button @click="abaAtiva = 'regulacao'" :class="abaAtiva === 'regulacao' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70 hover:text-amber-100'" class="py-2 rounded-xl transition">
          🌡️ Regulação
        </button>
        <button @click="abaAtiva = 'historico'" :class="abaAtiva === 'historico' ? 'bg-amber-600 text-stone-950 font-extrabold shadow' : 'text-amber-200/70 hover:text-amber-100'" class="py-2 rounded-xl transition">
          📜 Histórico
        </button>
      </nav>
    </header>

    <!-- ABA 1: MOSAICO VISUAL + LEGENDAS COLORIDAS + OBSERVAÇÃO DO DIA -->
    <template x-if="abaAtiva === 'mosaico'">
      <div class="space-y-4 no-print">

        <!-- 🎨 LEGENDAS DE REGA (MULTI-SELEÇÃO E EDIÇÃO) -->
        <section class="glass-card rounded-3xl p-4 space-y-3 border border-amber-500/40">
          <div class="flex justify-between items-center border-b border-amber-900/40 pb-2">
            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider lotr-sub">🎨 Legendas de Rega (Multi-Seleção)</span>
            <button @click="modoEdicaoLegenda = !modoEdicaoLegenda" class="text-[10px] text-amber-300 hover:underline">
              <span x-text="modoEdicaoLegenda ? 'Concluir Edição' : '✏️ Editar Legendas'"></span>
            </button>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
            <template x-for="(cat, idx) in legendas" :key="cat.id">
              <div 
                @click="!modoEdicaoLegenda && alternarLegendaNoDia(cat.id)"
                :class="[
                  cat.bg,
                  diaDetalheChave && mosaico[diaDetalheChave] && mosaico[diaDetalheChave].tipos.includes(cat.id) ? 'ring-2 ring-amber-300 font-black scale-105 shadow-lg' : 'opacity-70'
                ]"
                class="p-2.5 rounded-2xl border border-stone-800 cursor-pointer transition-all flex items-center justify-between text-stone-950 font-bold">
                
                <div class="flex items-center gap-2 truncate">
                  <span class="text-base" x-text="cat.icon"></span>
                  <template x-if="!modoEdicaoLegenda">
                    <span class="truncate text-[11px]" x-text="cat.nome"></span>
                  </template>
                  <template x-if="modoEdicaoLegenda">
                    <input type="text" x-model="cat.nome" @input="saveState()" class="w-full bg-stone-900/90 text-amber-100 text-[10px] p-1 rounded border border-amber-600/40 focus:outline-none">
                  </template>
                </div>

                <span x-show="diaDetalheChave && mosaico[diaDetalheChave] && mosaico[diaDetalheChave].tipos.includes(cat.id)" class="text-xs font-black">✓</span>
              </div>
            </template>
          </div>
        </section>

        <!-- MOSAICO DO MÊS 2026 -->
        <section class="glass-card rounded-3xl p-5 space-y-4 border border-emerald-500/40">
          <div class="flex justify-between items-center border-b border-amber-900/40 pb-2">
            <span class="text-xs font-bold text-amber-300 lotr-title">🧩 Mosaico do Cérebro (2026)</span>
            <span class="text-[10px] text-amber-200/60 italic" x-text="diaDetalheChave ? 'Selecionado: ' + diaDetalheChave : 'Toque num dia para pintar'"></span>
          </div>

          <!-- SELETOR DO MÊS -->
          <div class="flex items-center justify-between text-xs font-bold lotr-sub bg-stone-950/80 p-2 rounded-2xl border border-amber-900/40">
            <button @click="mesAtualIndex = (mesAtualIndex > 0 ? mesAtualIndex - 1 : 11)" class="text-amber-400 p-1">◀</button>
            <span class="text-amber-300 font-extrabold text-sm" x-text="nomesMeses[mesAtualIndex] + ' 2026'"></span>
            <button @click="mesAtualIndex = (mesAtualIndex < 11 ? mesAtualIndex + 1 : 0)" class="text-amber-400 p-1">▶</button>
          </div>

          <!-- GRADE DOS DIAS -->
          <div class="grid grid-cols-7 gap-2 text-center text-xs">
            <span class="text-[10px] text-stone-500 font-bold">Dom</span>
            <span class="text-[10px] text-stone-500 font-bold">Seg</span>
            <span class="text-[10px] text-stone-500 font-bold">Ter</span>
            <span class="text-[10px] text-stone-500 font-bold">Qua</span>
            <span class="text-[10px] text-stone-500 font-bold">Qui</span>
            <span class="text-[10px] text-stone-500 font-bold">Sex</span>
            <span class="text-[10px] text-stone-500 font-bold">Sáb</span>

            <template x-for="dia in diasDoMes" :key="dia.chave">
              <div 
                @click="dia.valido && selecionarDiaParaEditar(dia.chave)"
                :style="obterEstiloGradienteDia(dia.chave)"
                :class="[
                  dia.valido ? 'cursor-pointer hover:scale-110 active:scale-95' : 'opacity-10 cursor-default',
                  diaDetalheChave === dia.chave ? 'ring-2 ring-amber-300 scale-105 z-10' : '',
                  !temCor(dia.chave) ? 'bg-stone-950/80 border-stone-800/80 text-amber-200/50' : 'border-amber-400/60 text-stone-950 font-black shadow-md'
                ]"
                class="h-11 rounded-xl border flex flex-col items-center justify-center transition-all relative overflow-hidden">
                
                <span class="text-[11px] font-bold z-10" :class="temCor(dia.chave) ? 'text-stone-950 drop-shadow-sm font-black' : 'text-amber-200/70'" x-text="dia.numero"></span>
                
                <div class="flex items-center justify-center gap-0.5 z-10 max-w-full overflow-hidden">
                  <template x-for="ico in obterIconesDia(dia.chave)" :key="ico">
                    <span class="text-[8px]" x-text="ico"></span>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <!-- CAMPO OBSERVAÇÃO + ENVIAR PARA CAPTURA -->
          <div x-show="diaDetalheChave" class="p-4 bg-stone-950/90 rounded-2xl border border-amber-800/60 space-y-3 text-xs">
            <div class="flex justify-between items-center">
              <span class="font-bold text-amber-300" x-text="'📝 Nota do Dia • ' + diaDetalheChave"></span>
              <button @click="diaDetalheChave = null" class="text-amber-400 font-bold">✕</button>
            </div>
            
            <textarea x-model="mosaico[diaDetalheChave].observacaoCalendario" @input="saveState()" rows="2" placeholder="Anote a ideia rápida ou ocorrência..." class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>

            <button @click="enviarObsParaCaptura()" class="w-full py-2 bg-gradient-to-r from-emerald-600 to-teal-600 text-stone-950 font-black rounded-xl uppercase text-[10px]">
              🎯 Transformar Observação em Captura das 25 Fontes
            </button>
          </div>
        </section>

      </div>
    </template>

    <!-- ABA 2: CAPTURA & FURTOS UNIFICADOS (25 FONTES) -->
    <template x-if="abaAtiva === 'captura'">
      <section class="glass-card rounded-3xl p-5 space-y-4 border border-amber-500/40 no-print">
        <div class="border-b border-amber-900/40 pb-2">
          <h2 class="text-sm font-bold text-amber-300 lotr-title">🎯 Banco de Captura & Furtos (25 Fontes)</h2>
          <p class="text-[10px] text-amber-200/60 italic">Catalogado com tags de assunto e imagens para cruzamentos</p>
        </div>

        <div class="p-4 bg-stone-950/90 rounded-2xl border border-amber-800/60 space-y-3 text-xs">
          <span class="font-bold text-amber-300 block">➕ Nova Captura / Roubo Criativo:</span>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <select x-model="novaCaptura.fonte" class="p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
              <template x-for="f in fontesMandala" :key="f.nome">
                <option :value="f.nome" x-text="f.icon + ' ' + f.nome"></option>
              </template>
            </select>
            <input type="text" x-model="novaCaptura.tags" placeholder="Tags separadas por vírgula (Ex: #tdah, #design)" class="p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
          </div>

          <textarea x-model="novaCaptura.conteudo" rows="2" placeholder="O que você capturou ou roubou de interessante?" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>

          <div class="flex justify-between items-center gap-2">
            <input type="file" accept="image/*" @change="uploadImagemCaptura($event)" class="text-[10px] text-amber-200/70 file:mr-2 file:py-1 file:px-2.5 file:rounded-xl file:border-0 file:text-[10px] file:font-bold file:bg-stone-800 file:text-amber-300">
            <button @click="salvarCaptura()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-stone-950 font-black rounded-xl uppercase text-[10px] shadow">
              💾 Guardar Captura
            </button>
          </div>

          <template x-if="tempImagemCaptura">
            <div class="mt-2 rounded-xl overflow-hidden max-h-32 border border-amber-700/50">
              <img :src="tempImagemCaptura" class="w-full object-cover">
            </div>
          </template>
        </div>

        <!-- LISTA DE CAPTURAS SALVAS -->
        <div class="space-y-3 max-h-[400px] overflow-y-auto text-xs">
          <template x-for="(cap, idx) in capturas" :key="cap.id">
            <div class="p-3.5 bg-stone-950/80 rounded-2xl border border-amber-900/40 space-y-2">
              <div class="flex justify-between items-center text-[10px]">
                <span class="text-amber-400 font-bold" x-text="'Fonte: ' + cap.fonte"></span>
                <div class="flex items-center gap-2">
                  <span class="text-amber-200/50" x-text="cap.data"></span>
                  <button @click="removerCaptura(idx)" class="text-rose-400 font-bold hover:text-rose-300">✕</button>
                </div>
              </div>
              <p class="text-amber-100 whitespace-pre-wrap" x-text="cap.conteudo"></p>

              <template x-if="cap.imagem">
                <div class="rounded-xl overflow-hidden border border-amber-900/40 max-h-44 mt-1">
                  <img :src="cap.imagem" class="w-full object-cover">
                </div>
              </template>

              <div class="flex flex-wrap gap-1 pt-1">
                <template x-for="tag in cap.tagsArray" :key="tag">
                  <span class="text-[9px] bg-amber-950 text-amber-300 px-2 py-0.5 rounded-full border border-amber-800" x-text="tag"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </section>
    </template>

    <!-- ABA 3: CONEXÕES, SORTEADOR & TRANSFORMAÇÃO DE RECLAMAÇÕES -->
    <template x-if="abaAtiva === 'conexoes'">
      <section class="glass-card rounded-3xl p-5 space-y-4 border border-amber-500/40 no-print">
        <div class="border-b border-amber-900/40 pb-2">
          <h2 class="text-sm font-bold text-amber-300 lotr-title">🔀 Cruzamento de Ideias & Laboratório</h2>
          <p class="text-[10px] text-amber-200/60 italic">Combine ideias, sorteie conexões e transforme queixas em soluções</p>
        </div>

        <!-- 🎲 MOTOR DE COMBINAÇÃO ALEATÓRIA -->
        <div class="p-4 rounded-2xl bg-amber-950/40 border border-amber-600/60 space-y-3 text-xs">
          <div class="flex justify-between items-center">
            <span class="font-bold text-amber-300 flex items-center gap-1.5">
              <span>🎲</span> Motor de Combinação Criativa
            </span>
            <button @click="gerarCombinacaoAleatoria()" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold rounded-xl text-[10px]">
              Sorteiar Cruzamento 🔀
            </button>
          </div>

          <template x-if="combinacaoAtual">
            <div class="p-3 bg-stone-950/90 rounded-xl border border-amber-800/60 space-y-2">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px]">
                <div class="p-2 bg-stone-900 rounded-lg border border-stone-800">
                  <span class="text-[9px] text-amber-400 block font-bold">Item Capturado A:</span>
                  <span class="font-bold text-amber-100" x-text="combinacaoAtual.itemA"></span>
                </div>
                <div class="p-2 bg-stone-900 rounded-lg border border-stone-800">
                  <span class="text-[9px] text-amber-400 block font-bold">Item Capturado B:</span>
                  <span class="font-bold text-amber-100" x-text="combinacaoAtual.itemB"></span>
                </div>
              </div>
              <div class="p-2 bg-amber-950/60 rounded-lg text-amber-200 italic text-[10px]">
                💡 <strong>Oportunidade de Cruzamento:</strong> Como você pode aplicar a solução do Item A no formato do Item B?
              </div>
            </div>
          </template>
        </div>

        <!-- ⚡ RECLAMAÇÃO -> SOFTWARE MELHOR -->
        <div class="p-4 bg-rose-950/30 border border-rose-800/50 rounded-2xl space-y-2 text-xs">
          <span class="font-bold text-rose-300 block">💡 Transformador de Reclamações (Modo Gertrudes → Solução)</span>
          <p class="text-[10px] text-amber-200/60 italic">"A melhor maneira de reclamar de um software é criando um software melhor."</p>

          <input type="text" x-model="queixa.reclamacao" placeholder="Do que você quer reclamar hoje? (Qual a insatisfação?)" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100">
          <textarea x-model="queixa.solucao" rows="2" placeholder="Como seria a solução ideal que resolve essa dor?" class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>

          <button @click="salvarQueixaComoIdeia()" class="w-full py-2 bg-rose-700 hover:bg-rose-600 text-stone-950 font-bold rounded-xl uppercase text-[10px]">
            ⚡ Transformar Reclamação em Ideia de Projeto/Post
          </button>
        </div>

        <!-- 🎨 PAINEL LIVRE DE ESCRITA & IMAGEM DE CONEXÃO -->
        <div class="p-4 bg-stone-950/90 border border-amber-800/60 rounded-2xl space-y-3 text-xs">
          <span class="font-bold text-amber-300 block">🎨 Registrar Nova Fusão / Hipótese:</span>
          
          <textarea x-model="novoCruzamento.texto" rows="2" placeholder="Escreva sobre a fusão das ideias..." class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>

          <div class="flex justify-between items-center gap-2">
            <input type="file" accept="image/*" @change="uploadImagemCruzamento($event)" class="text-[10px] text-amber-200/70">
            <button @click="salvarCruzamento()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-stone-950 font-black rounded-xl uppercase text-[10px] shadow">
              Guardar Conexão
            </button>
          </div>

          <template x-if="tempImagemCruzamento">
            <div class="mt-2 rounded-xl overflow-hidden max-h-32 border border-amber-700/50">
              <img :src="tempImagemCruzamento" class="w-full object-cover">
            </div>
          </template>
        </div>

        <!-- LISTA DE CONEXÕES SALVAS -->
        <div class="space-y-3 max-h-[350px] overflow-y-auto text-xs">
          <template x-for="(con, idx) in conexoes" :key="con.id">
            <div class="p-3.5 bg-stone-950/80 rounded-2xl border border-amber-900/40 space-y-2">
              <div class="flex justify-between items-center text-[10px]">
                <span class="text-amber-300 font-bold" x-text="'Conexão registrada em: ' + con.data"></span>
                <button @click="removerConexao(idx)" class="text-rose-400 font-bold hover:text-rose-300">✕</button>
              </div>
              <p class="text-amber-100 whitespace-pre-wrap" x-text="con.texto"></p>
              <template x-if="con.imagem">
                <div class="rounded-xl overflow-hidden border border-amber-900/40 max-h-44 mt-1">
                  <img :src="con.imagem" class="w-full object-cover">
                </div>
              </template>
            </div>
          </template>
        </div>
      </section>
    </template>

    <!-- ABA 4: DIÁRIO DE BORDO VIVO (POR DATA + NICHOLSON BAKER + FOTOS) -->
    <template x-if="abaAtiva === 'bordo'">
      <section class="glass-card rounded-3xl p-5 space-y-4 border border-amber-500/40 no-print">
        <div class="flex justify-between items-center border-b border-amber-900/40 pb-2">
          <div>
            <h2 class="text-sm font-bold text-amber-300 lotr-title">⛵ Diário de Bordo Vivo</h2>
            <p class="text-[10px] text-amber-200/60 italic" x-text="'Navegação da data: ' + diaDetalheChave"></p>
          </div>
          <button @click="saveState()" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold rounded-xl text-xs shadow">
            💾 Salvar Bordo
          </button>
        </div>

        <!-- 🌟 PERGUNTA DE NICHOLSON BAKER -->
        <div class="bg-amber-950/40 p-3.5 rounded-2xl border border-amber-600/50 space-y-1 text-xs">
          <label class="block font-bold text-amber-300 flex items-center gap-1.5">
            <span>🌟</span> Qual foi a melhor coisa que aconteceu hoje? (Nicholson Baker)
          </label>
          <p class="text-[10px] text-amber-200/60 italic">"Uma forma particular de lembrar como a luz entrava..."</p>
          <textarea 
            x-model="mosaico[diaDetalheChave].melhorCoisa" 
            @input="saveState()" 
            rows="2" 
            placeholder="Ex: O café especial da tarde, a luz bonita na janela, a conversa..." 
            class="w-full p-2.5 bg-stone-950 border border-amber-900/60 rounded-xl text-amber-100 focus:outline-none mt-1"></textarea>
        </div>

        <!-- O QUE ACONTECEU -->
        <div class="bg-stone-950/80 p-3.5 rounded-2xl border border-amber-900/40 space-y-2 text-xs">
          <label class="block font-bold text-amber-200 flex items-center gap-1.5">
            <span>⛵</span> O que aconteceu hoje? (Projetos, Lugares, Livros, Filmes)
          </label>
          <textarea 
            x-model="mosaico[diaDetalheChave].acontecimentos" 
            @input="saveState()" 
            rows="3" 
            placeholder="Ex: Trabalhei no widget do Notion, almoço especial..." 
            class="w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-amber-100 focus:outline-none"></textarea>
        </div>

        <!-- UPLOAD DE IMAGEM DO DIA -->
        <div class="bg-stone-950/80 p-3.5 rounded-2xl border border-amber-900/40 space-y-2 text-xs">
          <label class="block font-bold text-amber-300 flex items-center gap-1.5">
            <span>📸</span> Imagem / Registro Visual da Navegação:
          </label>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBoCzavo5Poj1kjKZbJ9rUwkLQyyjpMgmI",
      authDomain: "benjamin-express-os.firebaseapp.com",
      projectId: "benjamin-express-os",
      storageBucket: "benjamin-express-os.firebasestorage.app",
      messagingSenderId: "318003877871",
      appId: "1:318003877871:web:54f4390f54c7710c5cc81a",
      measurementId: "G-41JWT5ZN72"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function laboratorioCriacaoApp() {
      return {
        salvando: false,
        abaAtiva: 'mosaico',
        mesAtualIndex: new Date().getMonth(),
        modoEdicaoLegenda: false,
        diaDetalheChave: new Date().toISOString().split('T')[0],
        mosaico: {},
        capturas: [],
        conexoes: [],
        esteiraFinal: [],
        combinacaoAtual: null,

        novaCaptura: { fonte: 'Pesquisas', tags: '', conteudo: '' },
        tempImagemCaptura: null,

        queixa: { reclamacao: '', solucao: '' },
        novoCruzamento: { texto: '' },
        tempImagemCruzamento: null,

        bordoVivo: { projeto: '', etapa: 'Meio' },
        esteiraPublicar: { titulo: '', ondeSalvo: '', estado: 'Rascunho Solto', rede: 'Instagram Studio Feed' },

        regulacao: { repetitivo: false, sofrimento: false, edai_util: false, edai_conforto: false },

        nomesMeses: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'],

        fontesMandala: [
          { nome: 'Pesquisas', icon: '🔍' }, { nome: 'Referências', icon: '📚' },
          { nome: 'Desenhos', icon: '✏️' }, { nome: 'Planos', icon: '🗺️' },
          { nome: 'Rabiscos', icon: '🎨' }, { nome: 'Protótipos', icon: '🛠️' },
          { nome: 'Diagramas', icon: '📊' }, { nome: 'Notas Rápidas', icon: '📝' },
          { nome: 'Fotografias', icon: '📸' }, { nome: 'Lixo de Projetos', icon: '♻️' },
          { nome: 'O que estou Aprendendo', icon: '🧠' }, { nome: 'O que estou Fazendo', icon: '🔨' },
          { nome: 'Livros', icon: '📖' }, { nome: 'TV & Filmes', icon: '🎬' },
          { nome: 'Sites & Newsletters', icon: '🌐' }, { nome: 'Mesa / Físico', icon: '🪴' },
          { nome: 'Insights de Conversas', icon: '💬' }, { nome: 'Posts & Interações', icon: '📱' },
          { nome: 'Padrões de Posts', icon: '📋' }, { nome: 'Curtidos & Salvos', icon: '⭐' },
          { nome: 'Pinterest', icon: '📌' }, { nome: 'Rascunhos do Blog', icon: '✍️' },
          { nome: 'Trello', icon: '🗂️' }, { nome: 'Arquivos do PC', icon: '💻' },
          { nome: 'Arquivos do Canva', icon: '🎨' }
        ],

        legendas: [
          { id: 'escrevi', nome: 'Escrevi / Texto', icon: '🟩', hex: '#34d399', bg: 'bg-emerald-400 border-emerald-300' },
          { id: 'li', nome: 'Li / Pesquisei', icon: '🟦', hex: '#38bdf8', bg: 'bg-sky-400 border-sky-300' },
          { id: 'ideia', nome: 'Tive uma Ideia', icon: '🟨', hex: '#fde047', bg: 'bg-amber-300 border-yellow-200' },
          { id: 'desenhei', nome: 'Desenhei / Design', icon: '🟪', hex: '#c084fc', bg: 'bg-purple-400 border-purple-300' },
          { id: 'incubacao', nome: 'Incubei o Projeto', icon: '🟥', hex: '#fb7185', bg: 'bg-rose-400 border-rose-300' },
          { id: 'descanso', nome: 'Descansei de Propósito', icon: '⬜', hex: '#d6d3d1', bg: 'bg-stone-300 border-stone-100' }
        ],

        get diasDoMes() {
          const ano = 2026;
          const primeiroDiaSemana = new Date(ano, this.mesAtualIndex, 1).getDay();
          const totalDiasNoMes = new Date(ano, this.mesAtualIndex + 1, 0).getDate();
          let lista = [];
          for (let i = 0; i < primeiroDiaSemana; i++) lista.push({ numero: '', chave: `vazio_${i}`, valido: false });
          for (let d = 1; d <= totalDiasNoMes; d++) {
            const mesStr = String(this.mesAtualIndex + 1).padStart(2, '0');
            const diaStr = String(d).padStart(2, '0');
            lista.push({ numero: d, chave: `2026-${mesStr}-${diaStr}`, valido: true });
          }
          return lista;
        },

        get historicoOrdenado() {
          return Object.keys(this.mosaico)
            .filter(k => this.mosaico[k] && ( (this.mosaico[k].tipos && this.mosaico[k].tipos.length > 0) || this.mosaico[k].observacaoCalendario || this.mosaico[k].melhorCoisa || this.mosaico[k].acontecimentos || this.mosaico[k].imagem ))
            .sort().reverse()
            .map(chave => {
              const item = this.mosaico[chave];
              const tipos = item.tipos || [];
              const icones = tipos.map(tId => {
                const leg = this.legendas.find(l => l.id === tId);
                return leg ? leg.icon : '';
              });
              return {
                data: chave,
                icones: icones,
                observacaoCalendario: item.observacaoCalendario || '',
                melhorCoisa: item.melhorCoisa || '',
                acontecimentos: item.acontecimentos || '',
                imagem: item.imagem || null
              };
            });
        },

        async initApp() {
          const cache = localStorage.getItem('laboratorio_criacao_backup');
          if (cache) {
            try {
              const parsed = JSON.parse(cache);
              this.mosaico = parsed.mosaico || {};
              this.capturas = parsed.capturas || [];
              this.conexoes = parsed.conexoes || [];
              this.esteiraFinal = parsed.esteiraFinal || [];
              this.regulacao = parsed.regulacao || this.regulacao;
              if (parsed.legendas) this.legendas = parsed.legendas;
            } catch(e) {}
          }

          db.collection("modo_casa").doc("laboratorio_criacao").onSnapshot((docSnap) => {
            if (docSnap.exists) {
              const data = docSnap.data();
              if (data.mosaico) this.mosaico = data.mosaico;
              if (data.capturas) this.capturas = data.capturas;
              if (data.conexoes) this.conexoes = data.conexoes;
              if (data.esteiraFinal) this.esteiraFinal = data.esteiraFinal;
              if (data.regulacao) this.regulacao = data.regulacao;
              if (data.legendas) this.legendas = data.legendas;
            }
          });

          if (!this.mosaico[this.diaDetalheChave]) {
            this.mosaico[this.diaDetalheChave] = { tipos: [], observacaoCalendario: '', melhorCoisa: '', acontecimentos: '', imagem: null };
          }
        },

        selecionarDiaParaEditar(chave) {
          this.diaDetalheChave = chave;
          if (!this.mosaico[chave]) this.mosaico[chave] = { tipos: [], observacaoCalendario: '', melhorCoisa: '', acontecimentos: '', imagem: null };
        },

        alternarLegendaNoDia(catId) {
          if (!this.mosaico[this.diaDetalheChave]) {
            this.mosaico[this.diaDetalheChave] = { tipos: [], observacaoCalendario: '', melhorCoisa: '', acontecimentos: '', imagem: null };
          }
          let tipos = this.mosaico[this.diaDetalheChave].tipos || [];
          if (tipos.includes(catId)) {
            tipos = tipos.filter(t => t !== catId);
          } else {
            tipos.push(catId);
          }
          this.mosaico[this.diaDetalheChave].tipos = tipos;
          this.saveState();
        },

        enviarObsParaCaptura() {
          const obs = this.mosaico[this.diaDetalheChave].observacaoCalendario;
          if (!obs) return alert('Escreva uma observação no dia antes de enviar.');
          this.novaCaptura.conteudo = obs;
          this.novaCaptura.fonte = 'Notas Rápidas';
          this.abaAtiva = 'captura';
        },

        uploadImagemCaptura(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => { this.tempImagemCaptura = e.target.result; };
          reader.readAsDataURL(file);
        },

        salvarCaptura() {
          if (!this.novaCaptura.conteudo && !this.tempImagemCaptura) return alert('Insira um conteúdo ou imagem para a captura.');
          const tagsArr = this.novaCaptura.tags ? this.novaCaptura.tags.split(',').map(t => t.trim()).filter(t => t) : [];
          this.capturas.unshift({
            id: 'c_' + Date.now(),
            fonte: this.novaCaptura.fonte,
            conteudo: this.novaCaptura.conteudo,
            imagem: this.tempImagemCaptura || null,
            tagsArray: tagsArr,
            data: new Date().toLocaleDateString('pt-BR')
          });
          this.novaCaptura = { fonte: 'Pesquisas', tags: '', conteudo: '' };
          this.tempImagemCaptura = null;
          this.saveState();
        },

        removerCaptura(idx) {
          if (confirm('Deseja excluir esta captura?')) {
            this.capturas.splice(idx, 1);
            this.saveState();
          }
        },

        gerarCombinacaoAleatoria() {
          const capturasValidas = this.capturas.length > 0 ? this.capturas : [{ conteudo: 'Conceito de Design Minimalista' }, { conteudo: 'Teoria da Regulação Emocional' }];
          const randomA = capturasValidas[Math.floor(Math.random() * capturasValidas.length)].conteudo;
          const randomB = capturasValidas[Math.floor(Math.random() * capturasValidas.length)].conteudo;
          this.combinacaoAtual = { itemA: randomA, itemB: randomB };
        },

        salvarQueixaComoIdeia() {
          if (!this.queixa.reclamacao) return alert('Preencha a reclamação.');
          this.capturas.unshift({
            id: 'c_' + Date.now(),
            fonte: 'Modo Gertrudes / Software Melhor',
            conteudo: `🚨 Reclamação: ${this.queixa.reclamacao} | 💡 Solução Ideal: ${this.queixa.solucao}`,
            tagsArray: ['#solucao', '#software-melhor'],
            data: new Date().toLocaleDateString('pt-BR')
          });
          this.queixa = { reclamacao: '', solucao: '' };
          this.abaAtiva = 'captura';
          this.saveState();
        },

        uploadImagemCruzamento(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => { this.tempImagemCruzamento = e.target.result; };
          reader.readAsDataURL(file);
        },

        salvarCruzamento() {
          if (!this.novoCruzamento.texto && !this.tempImagemCruzamento) return alert('Escreva sobre a conexão ou suba uma imagem.');
          this.conexoes.unshift({
            id: 'cx_' + Date.now(),
            texto: this.novoCruzamento.texto,
            imagem: this.tempImagemCruzamento || null,
            data: new Date().toLocaleDateString('pt-BR')
          });
          this.novoCruzamento = { texto: '' };
          this.tempImagemCruzamento = null;
          this.saveState();
        },

        removerConexao(idx) {
          if (confirm('Deseja excluir esta conexão?')) {
            this.conexoes.splice(idx, 1);
            this.saveState();
          }
        },

        uploadImagemDia(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            if (!this.mosaico[this.diaDetalheChave]) {
              this.mosaico[this.diaDetalheChave] = { tipos: [], observacaoCalendario: '', melhorCoisa: '', acontecimentos: '', imagem: null };
            }
            this.mosaico[this.diaDetalheChave].imagem = e.target.result;
            this.saveState();
          };
          reader.readAsDataURL(file);
        },

        removerImagemDia() {
          if (this.mosaico[this.diaDetalheChave]) {
            this.mosaico[this.diaDetalheChave].imagem = null;
            this.saveState();
          }
        },

        salvarNaEsteiraFinal() {
          if (!this.esteiraPublicar.titulo) return alert('Insira o título do conteúdo.');
          this.esteiraFinal.unshift({ ...this.esteiraPublicar, id: 'e_' + Date.now() });
          this.esteiraPublicar = { titulo: '', ondeSalvo: '', estado: 'Rascunho Solto', rede: 'Instagram Studio Feed' };
          this.saveState();
          alert('🚀 Registrado na esteira final com sucesso!');
        },

        removerEsteira(idx) {
          if (confirm('Deseja remover este item da esteira?')) {
            this.esteiraFinal.splice(idx, 1);
            this.saveState();
          }
        },

        imprimirHistorico() {
          window.print();
        },

        temCor(chave) { return this.mosaico[chave] && this.mosaico[chave].tipos && this.mosaico[chave].tipos.length > 0; },

        obterEstiloGradienteDia(chave) {
          if (!this.temCor(chave)) return '';
          const tipos = this.mosaico[chave].tipos;
          let cores = tipos.map(tId => {
            const leg = this.legendas.find(l => l.id === tId);
            return leg ? leg.hex : '#78716c';
          });
          if (cores.length === 1) return `background-color: ${cores[0]};`;
          const percentual = 100 / cores.length;
          let stops = [];
          cores.forEach((cor, idx) => stops.push(`${cor} ${(idx * percentual).toFixed(1)}% ${((idx + 1) * percentual).toFixed(1)}%`));
          return `background: linear-gradient(to bottom, ${stops.join(', ')});`;
        },

        obterIconesDia(chave) {
          if (!this.temCor(chave)) return [];
          const tipos = this.mosaico[chave].tipos;
          return tipos.map(tId => {
            const leg = this.legendas.find(l => l.id === tId);
            return leg ? leg.icon : '';
          });
        },

        salvarLocal() {
          localStorage.setItem('laboratorio_criacao_backup', JSON.stringify({
            mosaico: this.mosaico, capturas: this.capturas, conexoes: this.conexoes, esteiraFinal: this.esteiraFinal, regulacao: this.regulacao, legendas: this.legendas
          }));
        },

        async saveState() {
          this.salvando = true;
          this.salvarLocal();
          try {
            await db.collection("modo_casa").doc("laboratorio_criacao").set({
              mosaico: this.mosaico, capturas: this.capturas, conexoes: this.conexoes, esteiraFinal: this.esteiraFinal, regulacao: this.regulacao, legendas: this.legendas,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            this.salvando = false;
          } catch(e) { this.salvando = false; }
        }
      }
    }
  </script>
</body>
</html>
